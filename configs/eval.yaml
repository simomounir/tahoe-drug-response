# Evaluation settings fixed before any model exists (evaluation.md §5.1, amendment A5, 2026-09-26).
de_genes:
  source: tahoe_deseq2          # metadata/pseudobulk_differential_expression, plate-matched DMSO
  padj_below: 0.05
  top_n: 200
  rank_by: padj                 # ascending; ties broken by larger |log2FoldChange|
  effect_size_threshold: null   # none: padj and the cap define the set
  missing_condition: exclude_and_count
min_de_genes: 20
split_eligibility:
  min_fraction_treated_with_logfc: 0.5   # amendment A2: excludes 5 of 50 lines
# Phase 4a harness (spec docs/superpowers/specs/2026-09-27-phase4a-harness-design.md §7).
splits:
  repeats: 5
  seeds: [20260927, 20260928, 20260929, 20260930, 20261001]
  test_fraction: 0.20
  val_fraction: 0.15
metrics:
  topk: [50, 100]
bootstrap:
  resamples: 2000
  interval: 0.95
  seed: 20260927
gene_universe: depmap_protein_coding
de_fetch:
  per_line_network_cap_gb: 3   # one subprocess per line; a line's plates 1-3 are ~0.5-1 GB, the first line also pays the ~1.2 GB footer scan
models:                       # constructor kwargs per predictor (phase 4b spec)
  ridge: &ridge
    alpha_log10_start: -4.0     # alpha grid 10^-4 ... 10^6, half-decade steps (21 values), chosen on val (B5); lower end widened from 10^-2 (4b run: α at the edge in all 5 random repeats)
    alpha_log10_stop: 6.0
    alpha_log10_step: 0.5
  ridge_nocell:                 # cell-feature ablation (phase 4c N6)
    <<: *ridge
    use_cell_features: false
  neural: &neural              # MLP on ridge's inputs, residual on the per-dose mean (phase 4c N1–N8)
    hidden: 512
    dropouts: [0.2, 0.5]        # search per fit: dropout x weight decay = 4 configs, early stopping on val de_pearson
    weight_decays: [1.0e-4, 1.0e-2]
    lr: 1.0e-3
    batch_size: 256
    max_epochs: 200              # early stopping (patience) decides; the N9 probe showed 50 still improving on random (owner: do not undertrain)
    patience: 5
    seed: 20260927
  neural_nocell:                # cell-feature ablation (N6)
    <<: *neural
    use_cell_features: false
