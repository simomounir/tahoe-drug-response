min_cells_per_condition: 100
min_control_cells: 500

# Exact drug names treated as vehicle controls (not substrings).
control_drugs:
  - DMSO_TF

# Plates 1-3 test the same 92 drugs at 0.05 / 0.5 / 5 uM (Adagrasib 0.05 uM is on every plate).
plates:
  - plate1
  - plate2
  - plate3

# null = report only; a number = fail the build if pseudobulk + logfc exceed it (MB = 1e6 bytes).
max_output_mb: 3000

# These thresholds match the draft Phase 1 QC contract; the final slice should be
# rechecked against plate-matched controls and DepMap coverage before publication.
