dataset_revision: main
status: validated_candidate
notes: >-
  This slice is based on the live remote metadata counts gathered in Step 0. The
  selected cell lines are the highest-depth lines in the dataset. All 8 resolve to
  a DepMap ID and span 5 tissues (see cell_line_info). CVCL_0334 is shallow on
  plate3 and duplicates pancreas; CVCL_0131 (A-172, CNS) is the proposed swap.

selected_cell_lines:
  - CVCL_0546
  - CVCL_0459
  - CVCL_0480
  - CVCL_1285
  - CVCL_0399
  - CVCL_1056
  - CVCL_0293
  - CVCL_0334

# From tahoebio/Tahoe-100M metadata/cell_line_metadata.parquet
# (Cell_ID_Cellosaur -> Cell_ID_DepMap, Organ). Cell names in comments.
cell_line_info:
  CVCL_0546: {depmap_id: ACH-000842, tissue: Bowel}     # SW480
  CVCL_0459: {depmap_id: ACH-000463, tissue: Lung}      # NCI-H460
  CVCL_0480: {depmap_id: ACH-000164, tissue: Pancreas}  # PANC-1
  CVCL_1285: {depmap_id: ACH-000861, tissue: Lung}      # HOP62
  CVCL_0399: {depmap_id: ACH-000950, tissue: Bowel}     # LoVo
  CVCL_1056: {depmap_id: ACH-000555, tissue: Kidney}    # A498
  CVCL_0293: {depmap_id: ACH-000954, tissue: Uterus}    # HEC-1-A
  CVCL_0334: {depmap_id: ACH-000178, tissue: Pancreas}  # Hs 766T

min_cells_per_condition: 100
min_control_cells: 500

# Exact drug names treated as vehicle controls (not substrings).
control_drugs:
  - DMSO_TF

# Plates to build. Each plate is one dose (see docs/step0_findings.md §5).
plates:
  - plate3

# These thresholds match the draft Phase 1 QC contract; the final slice should be
# rechecked against plate-matched controls and DepMap coverage before publication.
